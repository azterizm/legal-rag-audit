# Release: build, attest, sign, publish — on a GPG-signed tag and nothing else.
#
# What a release has to answer, for someone who has never met us (§12.5):
#
#   "who published this"     — a GPG-signed tag, verified before anything is built
#   "was it built from that" — SLSA build provenance from a public workflow
#   "is this the same file"  — a cosign signature over each artefact, keyless
#   "what is inside it"      — a CycloneDX SBOM per dependency layer
#
# None of the four is our word. The tag signature is checked against a key the reader
# fetches themselves; the provenance is issued by GitHub's OIDC identity, not by us; the
# cosign signature is logged in the public Rekor transparency log, so a signature that
# existed only for one person to see would be visible as an absence. Whoever holds this
# repository cannot quietly re-sign an artefact after the fact.
#
# scripts/verify_release.sh is the reader's half of this file. Whenever a step here
# changes, that script has to change with it, or the instructions stop describing the
# artefacts.
#
# Two container images are published here as well, and they get the same four answers:
# built from the verified tag, attested, cosign-signed by digest, and inventoried by
# `trivy image` in security.yml. They are published by digest and referenced by digest —
# the version tag exists for humans, and `latest` is not published at all. A mutable
# pointer to "the current image" would undo, in one line, what pinning every dependency
# to its bytes was for.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing signed tag to release"
        required: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  verify-tag:
    name: the tag is signed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      # First, before anything is built. A release pipeline that builds and then checks
      # the signature has already spent its provenance on an unverified commit.
      #
      # The public key is committed to the repository so this step needs no secret and
      # no keyserver — a keyserver fetch here would mean the build trusted whatever the
      # network returned that morning.
      - name: Verify the tag signature
        run: |
          set -euo pipefail
          gpg --import .github/release-signing-key.asc
          TAG="${{ inputs.tag || github.ref_name }}"
          if ! git cat-file -t "$TAG" | grep -q '^tag$'; then
            echo "::error::$TAG is a lightweight tag. A release tag must be annotated"
            echo "and signed: git tag -s $TAG -m '...'"
            exit 1
          fi
          git verify-tag --raw "$TAG" 2>&1 | tee /tmp/verify.txt
          grep -q 'GOODSIG' /tmp/verify.txt

      - name: Verify the tagged commit is signed
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          git verify-commit --raw "$TAG^{commit}" 2>&1 | tee /tmp/commit.txt
          grep -q 'GOODSIG' /tmp/commit.txt

  images:
    name: build, attest and sign the images
    needs: verify-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # OIDC, for both the SLSA attestation and keyless cosign
      attestations: write
    outputs:
      generate: ${{ steps.generate.outputs.digest }}
      score: ${{ steps.score.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Two images, not a matrix, because each one needs its digest as a named job
      # output and a matrix has one set of outputs between all its legs. The
      # duplication is four lines; the alternative is passing digests through an
      # artefact, which is more machinery hiding the thing this job exists to produce.
      #
      # `latest` is not among the tags and never will be. The version tag is here so a
      # human can find the image; the digest below is what anybody should actually run,
      # and it is what the signature and the provenance are made over. Publishing a
      # mutable pointer to "the current image" would undo, in one line, everything
      # --require-hashes and the base-image digest are for.
      #
      # linux/amd64 only. An arm64 image is one build command away from the repository
      # (`docker build -f Dockerfile.generate .`, verified on Apple Silicon), and
      # publishing an emulated build we have not run would be shipping an artefact
      # nobody tested to save a reader one command.
      - name: generate image
        id: generate
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.generate
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}-generate:${{ inputs.tag || github.ref_name }}
          provenance: false # SLSA provenance comes from attest-build-provenance below
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.tag || github.ref_name }}

      # The score image ships without model weights (see Dockerfile.score). Baking them
      # would put checkpoints resolved by name, with no revision pinned, inside a signed
      # artefact — a signature over bytes nobody chose. The weights are mounted instead,
      # and docs/hardened-run.md says how.
      - name: score image
        id: score
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.score
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}-score:${{ inputs.tag || github.ref_name }}
          provenance: false
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.tag || github.ref_name }}

      - name: Attest build provenance — generate
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ghcr.io/${{ github.repository }}-generate
          subject-digest: ${{ steps.generate.outputs.digest }}
          push-to-registry: true

      - name: Attest build provenance — score
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ghcr.io/${{ github.repository }}-score
          subject-digest: ${{ steps.score.outputs.digest }}
          push-to-registry: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Signed by digest, never by tag. `cosign sign image:v0.2.0` signs whatever that
      # tag resolves to at the moment of signing, which is a signature over a name
      # rather than over bytes — and the name can be moved afterwards.
      - name: Sign both images
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          REPO="ghcr.io/${{ github.repository }}"
          cosign sign "${REPO}-generate@${{ steps.generate.outputs.digest }}"
          cosign sign "${REPO}-score@${{ steps.score.outputs.digest }}"

  build:
    name: build, attest and sign
    needs: [verify-tag, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload assets
      id-token: write # OIDC, for both the SLSA attestation and keyless cosign
      attestations: write # store the provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install the dev layer, hash-verified
        run: python3 -m pip install --require-hashes -r requirements/dev.txt

      # The gates run again here rather than being taken on trust from ci.yml. A tag can
      # point at a commit that never passed CI, and "it was green on main" is not a
      # property of the artefact being signed.
      - name: Repository gates
        run: |
          ./scripts/check_no_remote_scoring.sh
          python3 scripts/check_pins.py
          python3 scripts/check_readme_claims.py
          python3 -m pip install --no-deps -e .
          python3 scripts/gen_schemas.py --check
          python3 scripts/gen_sbom.py --check

      # §14.2's release blocker: a build that cannot find planted defects, or that
      # invents findings against a target behaving correctly, does not get signed. Run
      # here as well as in ci.yml for the same reason as the gates above — a tag can
      # point at a commit that never passed CI.
      #
      # `-m "not slow"` excludes the two Tier 2 rows, which fetch model weights resolved
      # by name. Making a signed release depend on a third party returning the same
      # bytes for an unpinned reference is the substitution this entire workflow exists
      # to prevent; those rows are verified in CI, where nothing is signed.
      - name: Sensitivity and specificity
        run: python3 -m pytest tests/test_reference_target.py -q -m "not slow"

      - name: Build the wheel and sdist
        run: python3 -m build --outdir dist/

      - name: Collect the SBOMs
        run: cp sbom/*.cdx.json dist/

      # The tag → digest mapping, written down and then treated like every other
      # artefact: checksummed, cosign-signed, attested. Without it the mapping lives
      # only in a registry that the same people who publish the release control, and
      # "run this digest" would be an instruction a reader has no way to check against
      # anything. With it, the mapping is covered by the release's own provenance.
      - name: Record the image digests
        env:
          GENERATE: ${{ needs.images.outputs.generate }}
          SCORE: ${{ needs.images.outputs.score }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          REPO="ghcr.io/${{ github.repository }}"
          cat > dist/IMAGES <<EOF
          # Container images published for ${TAG}. Run the digest, not the tag.
          # Verify: ./scripts/verify_release.sh ${TAG}
          ${REPO}-generate@${GENERATE}
          ${REPO}-score@${SCORE}
          EOF
          cat dist/IMAGES

      # SLSA build provenance: a signed statement that these exact bytes came out of
      # this workflow, at this commit, in this repository. Issued against GitHub's OIDC
      # identity — we cannot mint one for an artefact built on a laptop, which is the
      # entire value of it.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "dist/*"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless. There is no signing key to store, rotate or lose, and no secret whose
      # compromise would let someone sign as us after the fact — the identity is the
      # workflow, and every signature is written to the public Rekor log.
      - name: Sign every artefact
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          for artefact in dist/*; do
            cosign sign-blob \
              --output-signature "${artefact}.sig" \
              --output-certificate "${artefact}.pem" \
              "${artefact}"
          done

      - name: Checksums
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/* \
            --title "$TAG" \
            --verify-tag \
            --notes "$(cat <<'NOTES'
          Every artefact in this release is signed and independently verifiable.

          ```bash
          ./scripts/verify_release.sh <tag>
          ```

          That script checks four things, none of which rest on our word: the tag's GPG
          signature, the SLSA build provenance issued by GitHub's OIDC identity, the
          cosign signature recorded in the public Rekor transparency log, and the
          SHA-256 of each file. See SECURITY.md for what each one does and does not
          establish.

          The `*.cdx.json` files are CycloneDX 1.6 SBOMs, one per dependency layer.
          `legal-rag-audit-generate.cdx.json` is the only one that describes what a
          target installs on their own machine.

          `IMAGES` lists the two container images and their digests. Run the digest,
          not the tag — the tag is for finding the image, the digest is what is
          signed. `legal-rag-audit-generate` is the one to hand a target: it carries
          five pure-Python dependencies and no ML stack. See docs/hardened-run.md for
          the invocation, which denies egress rather than asking anyone to disable it.
          NOTES
          )"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artefacts
          path: dist/
