# Tests and the repository gates, on every push and pull request.
#
# Every action is pinned to a commit SHA, never a tag. A tag is a mutable pointer: an
# action referenced as `@v5` runs whatever its owner moves that tag to, which is the
# exact substitution `--require-hashes` exists to prevent one layer down. Pinning the
# dependency tree and then trusting six mutable references in CI would leave the
# supply-chain claim resting on the weakest link in it. tests/test_supply_chain.py
# fails the build if an unpinned reference appears.
#
# Permissions are read-only at the top and never widened here. Releases need more; they
# live in release.yml where the elevation is visible in isolation.

name: ci

on:
  push:
    branches: [main, v2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  gates:
    name: repository gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # The gates run before the tests, and without installing anything. Each one is a
      # claim in the README made mechanical; a reader who does not trust the tests can
      # still run these five commands in a clone.
      - name: No remote scoring path
        run: ./scripts/check_no_remote_scoring.sh

      - name: Dependency pins are exact, hashed and consistent across layers
        run: python3 scripts/check_pins.py

      - name: README claims carry their scope
        run: python3 scripts/check_readme_claims.py

      - name: Published JSON Schemas match the models
        run: |
          python3 -m pip install --quiet --require-hashes \
            -r requirements/generate.txt
          python3 -m pip install --quiet --no-deps -e .
          python3 scripts/gen_schemas.py --check

      - name: SBOMs describe the lockfiles
        run: python3 scripts/gen_sbom.py --check

  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is `requires-python`; 3.13 is the newest the lockfiles resolve for. The
        # lockfiles are resolved universally at 3.11, so a 3.13 run also checks that the
        # environment markers select correctly rather than only that the code parses.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the dev layer, hash-verified
        run: |
          python3 -m pip install --require-hashes -r requirements/dev.txt
          python3 -m pip install --no-deps -e .

      # Not `-m "not slow"`. The slow tests are the ones that build a venv without torch
      # and assert the boundary holds, and the boundary is the security claim — skipping
      # them in CI would leave it asserted only in a docstring.
      - name: Tests
        run: python3 -m pytest -q

  self-verification:
    name: sensitivity and specificity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install the dev layer, hash-verified
        run: |
          python3 -m pip install --require-hashes -r requirements/dev.txt
          python3 -m pip install --no-deps -e .

      # §14.2's two numbers, as their own check rather than buried in the test matrix.
      # Sensitivity: every registered evaluator, given a target exhibiting the defect it
      # looks for, reports it. Specificity: a target behaving correctly produces no
      # findings across three passes — and a false positive there is a release blocker.
      #
      # LEGAL_RAG_AUDIT_TIER2_GATE is set here and nowhere else. The two model-backed
      # rows fetch checkpoints resolved by name, and running them on every matrix entry
      # of every push would mean downloading unpinned weights three times a commit.
      # The checkpoints, fetched while a network still exists.
      #
      # `score` disables sockets at start-up, so a checkpoint that is not already in the
      # local cache does not download — it raises `OfflineViolation`, which is the
      # enforcement working. The fix is to put the weights in the cache beforehand, never
      # to relax the enforcement for the one job that would find it inconvenient.
      #
      # Resolved by name, with no revision pinned. That is a recorded manifest gap
      # (Dockerfile.score says the same thing about BAKE_MODELS): this step fetches
      # whatever the hub serves today, so a Tier 2 row here is scoped to that, exactly
      # as a Semgrep result is scoped to the rules published that morning.
      - name: Pre-fetch the Tier 2 checkpoints
        run: |
          python3 - <<'PY'
          from sentence_transformers import CrossEncoder, SentenceTransformer

          # The two defaults in evaluators/retrieval.py and evaluators/hallucination.py.
          SentenceTransformer("all-MiniLM-L6-v2")
          CrossEncoder("cross-encoder/nli-deberta-v3-base")
          PY

      # HF_HUB_OFFLINE, for the same reason Dockerfile.score sets it. A cached checkpoint
      # is not enough on its own: `hf_hub_download` still makes a metadata call to see
      # whether the hub has something newer, and that call is the one scoring refuses.
      # With the variable set, the loader resolves from the cache and opens no socket —
      # which is also the stronger property, because the weights a row was scored against
      # are then the ones fetched by the step above rather than whatever arrived mid-run.
      - name: Harness self-verification
        env:
          LEGAL_RAG_AUDIT_TIER2_GATE: "1"
          HF_HUB_OFFLINE: "1"
        run: python3 -m pytest tests/test_reference_target.py -q

  artefact-route:
    name: artefact route, no network
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install the generate layer, hash-verified
        run: |
          python3 -m pip install --require-hashes -r requirements/generate.txt
          python3 -m pip install --no-deps -e .

      # §5.1.1: plant, hash and score never touch a network. Asserted here by removing
      # the network rather than by removing the HTTP client, which is the other half of
      # what tests/test_dependency_boundary.py checks. `unshare --net` drops the process
      # into an empty network namespace — a socket call fails rather than resolving.
      #
      # `sudo`, and not `--map-root-user`, because the runner image restricts
      # unprivileged user namespaces (`kernel.apparmor_restrict_unprivileged_userns`) and
      # `unshare --map-root-user` now fails on `/proc/self/uid_map` before the step runs
      # at all. The alternative was turning that kernel restriction off for the job,
      # which trades a hardening on the host for a convenience in a test.
      #
      # Elevation buys the namespace and nothing else — the claim under test is about
      # egress, not privilege, and root inside an empty netns still cannot reach
      # anything. The script's own probe is what keeps this honest: if `unshare` ever
      # silently does nothing, the connection to 1.1.1.1 succeeds and the step fails
      # rather than passing with a guarantee it never tested.
      #
      # The interpreter is named by absolute path because sudo's `secure_path` drops the
      # setup-python directory from PATH, and the system python3 has none of this
      # installed.
      - name: plant → hash → score with no network namespace
        run: sudo unshare --net "$(command -v python3)" .github/scripts/artefact_route.py
